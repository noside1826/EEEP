name: Actualizar archivo XML diariamente

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC (Ajusta la hora según necesites)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar el proceso manualmente cuando quieras

jobs:
  actualizar-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Descargar el XML desde la fuente
        run: |
          curl -s "https://www.open-epg.com/files/peru2.xml" -o archivo.xml

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archivo.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update XML [$(date +'%Y-%m-%d')]" && git push)
